<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="flex flex-column md:flex-row md:align-items-center justify-content-between gap-3 mb-4">
                <div>
                    <h2 class="m-0">Latest posts</h2>
                    <span class="text-color-secondary">
                        {{ totalCount }} post{{ totalCount === 1 ? '' : 's' }} — click a row to read the full post.
                    </span>
                </div>
                <a routerLink="/create">
                    <button pButton type="button" icon="pi pi-plus" label="New Post"></button>
                </a>
            </div>

            <div class="flex flex-column sm:flex-row gap-2 mb-3">
                <span class="p-input-icon-left flex-auto">
                    <i class="pi pi-search"></i>
                    <input
                        type="text"
                        pInputText
                        class="w-full"
                        placeholder="Search title, body or author…"
                        [(ngModel)]="searchTerm"
                        (ngModelChange)="onSearchChange()"
                    />
                </span>
                <button
                    pButton
                    type="button"
                    label="Clear"
                    icon="pi pi-filter-slash"
                    class="p-button-outlined"
                    (click)="clearFilters()"
                ></button>
            </div>

            <ag-grid-angular
                class="ag-theme-quartz"
                style="width: 100%; height: 460px;"
                [gridOptions]="gridOptions"
                [defaultColDef]="defaultColDef"
                [columnDefs]="columnDefs"
                [tooltipShowDelay]="300"
                (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)"
            ></ag-grid-angular>

            <small class="text-color-secondary block mt-2">
                Sort by clicking a column header · filter authors in the column filter row · search is server-side.
            </small>
        </div>
    </div>
</div>
