# Render Blueprint — NestJS API (Docker) + Angular static site on Render's
# free tier. Uses an external free Postgres (Neon) so nothing expires.
# Full walkthrough: docs/DEPLOY.md
#
#   1. Create a free Postgres at https://neon.tech, copy its connection string.
#   2. https://dashboard.render.com/blueprints -> "New Blueprint Instance"
#      -> connect this repo -> Apply.
#   3. When prompted, paste the Neon string as DATABASE_URL; leave CORS_ORIGIN
#      blank for now.
#   4. Once blog-frontend has a URL: Dashboard -> blog-api -> Environment ->
#      set CORS_ORIGIN to that URL -> Save.
#
# Free-tier note: the API sleeps after 15 min idle and wakes in ~40s.

services:
  # ---- NestJS API (Docker) --------------------------------------------------
  - type: web
    name: blog-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Paste your Neon connection string when the blueprint prompts.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "true"
      - key: AI_PROVIDER
        value: heuristic
      # Set this to the blog-frontend URL after the first deploy (Dashboard ->
      # blog-api -> Environment). Kept out of the blueprint so the API and the
      # static site don't form a circular dependency at apply time.
      - key: CORS_ORIGIN
        sync: false

  # ---- Angular static site ------------------------------------------------
  - type: web
    name: blog-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && node scripts/set-env.js && npm run build
    staticPublishPath: dist/sakai-ng
    autoDeploy: true
    envVars:
      # Angular 17 / sakai-ng 17 does not build on Render's default Node 22.
      - key: NODE_VERSION
        value: "20.19.4"
      - key: API_HOST
        fromService:
          type: web
          name: blog-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
