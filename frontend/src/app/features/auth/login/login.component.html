<p-toast></p-toast>

<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div class="text-900 text-5xl font-medium mb-5">
            <i class="pi pi-book text-primary mr-2"></i>Sakai Blog
        </div>
        <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius: 53px">
                <form [formGroup]="form" (ngSubmit)="submit()">
                    <div class="text-center mb-5">
                        <div class="text-900 text-3xl font-medium mb-3">Welcome back</div>
                        <span class="text-600 font-medium">Sign in to continue</span>
                    </div>

                    <label for="email" class="block text-900 text-xl font-medium mb-2">Email</label>
                    <input id="email" type="email" placeholder="Email address" pInputText formControlName="email"
                        class="w-full md:w-30rem mb-1" style="padding: 1rem" />
                    <small class="p-error block mb-3" *ngIf="f.email.touched && f.email.invalid">
                        Enter a valid email address.
                    </small>

                    <label for="password" class="block text-900 font-medium text-xl mb-2">Password</label>
                    <p-password id="password" formControlName="password" placeholder="Password" [toggleMask]="true"
                        [feedback]="false" styleClass="w-full mb-1" inputStyleClass="w-full p-3 md:w-30rem"></p-password>
                    <small class="p-error block mb-3" *ngIf="f.password.touched && f.password.invalid">
                        Password is required.
                    </small>

                    <button pButton pRipple type="submit" label="Sign In" class="w-full p-3 text-xl mt-3"
                        [loading]="loading"></button>

                    <div class="text-center mt-4">
                        <span class="text-600">No account? </span>
                        <a routerLink="/auth/register" class="font-medium no-underline cursor-pointer text-primary">Create one</a>
                    </div>
                    <div class="text-center mt-3 text-500 text-sm">
                        Demo login — demo&#64;blog.test / password123
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
