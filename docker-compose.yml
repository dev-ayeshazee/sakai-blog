services:
  db:
    image: postgres:16-alpine
    container_name: blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      # Host 5544 to avoid clashing with a native Postgres and other local containers.
      - "5544:5432"
    volumes:
      - blog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: blog-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # Point at the compose db service. Swap this single line for your
      # Supabase connection string to run against Supabase instead.
      DATABASE_URL: postgres://blog:blog@db:5432/blog
      DATABASE_SSL: "false"
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:4200
      # Runs pending migrations on boot (see AppModule).
      RUN_MIGRATIONS: "true"
    ports:
      - "3001:3001"

volumes:
  blog-db-data:
