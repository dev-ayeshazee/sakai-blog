# Render Blueprint — deploy the whole stack (Postgres + NestJS API + Angular
# static site) on Render's free tier. Full walkthrough: docs/DEPLOY.md
#
#   1. https://dashboard.render.com/blueprints -> "New Blueprint Instance"
#   2. Connect this repo -> Apply (leave the CORS_ORIGIN prompt blank).
#   3. When both URLs exist: Dashboard -> blog-api -> Environment ->
#      set CORS_ORIGIN to the blog-frontend URL -> Save.
#
# Free tier notes: the web service sleeps after 15 min idle (~50s cold start);
# Render's free Postgres is removed ~30 days after creation (swap DATABASE_URL
# for a free Neon/Supabase string to keep it alive — see docs/DEPLOY.md).

databases:
  - name: blog-db
    plan: free
    databaseName: blog
    user: blog
    region: oregon

services:
  # ---- NestJS API (Docker) --------------------------------------------------
  - type: web
    name: blog-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: blog-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "true"
      - key: AI_PROVIDER
        value: heuristic
      # Set this to the blog-frontend URL after the first deploy (Dashboard ->
      # blog-api -> Environment). Kept out of the blueprint so the API and the
      # static site don't form a circular dependency at apply time.
      - key: CORS_ORIGIN
        sync: false

  # ---- Angular static site ------------------------------------------------
  - type: web
    name: blog-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && node scripts/set-env.js && npm run build
    staticPublishPath: dist/sakai-ng
    autoDeploy: true
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: blog-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
